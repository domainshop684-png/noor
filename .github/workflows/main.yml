name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q noor_app.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build release APK
        working-directory: noor_app
        run: |
          flutter create . --platforms=android --project-name noor_app --org com.example
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: noor_app/build/app/outputs/flutter-apk/app-release.apk
